<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnSide Laundry - Assets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }

        /* Video Section */
        .section {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 25px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }

        .video-container {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #666;
        }

        /* Gallery Section */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .gallery-item-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            padding: 15px 10px 10px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5rem;
            }

            .section {
                padding: 25px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            .gallery-item img {
                height: 150px;
            }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 60px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s ease;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #764ba2;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>InnSide Laundry</h1>
            <p>Asset Collection & Media Hub</p>
        </header>

        <div class="content">
            <!-- Video Section -->
            <section class="section">
                <h2>📹 Featured Video</h2>
                <div class="video-container">
                    <video controls poster="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/Facade%20-%20InnSide%20Laundry.JPG">
                        <source src="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/Ready%20to%20Wash%20%26%20Dry.mp4" type="video/mp4">
                        Your browser does not support the video tag. 
                        <a href="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/Ready%20to%20Wash%20%26%20Dry.mp4">Download video</a>
                    </video>
                </div>
                <div class="video-info">
                    <strong>Title:</strong> Ready to Wash & Dry<br>
                    <strong>Format:</strong> MP4 Video<br>
                    <strong>Size:</strong> ~852 KB
                </div>
                <div class="btn-group">
                    <a href="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/Ready%20to%20Wash%20%26%20Dry.mp4" class="btn" download>Download Video</a>
                    <a href="https://github.com/innsidelaundry-boop/innside-assets" class="btn btn-secondary">View on GitHub</a>
                </div>
            </section>

            <!-- Image Gallery Section -->
            <section class="section">
                <h2>🖼️ Image Gallery</h2>
                <div class="gallery">
                    <div class="gallery-item">
                        <img src="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/Facade%20-%20InnSide%20Laundry.JPG" alt="Facade - InnSide Laundry">
                        <div class="gallery-item-name">Facade</div>
                    </div>
                    <div class="gallery-item">
                        <img src="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/Couple%20Laundry.png" alt="Couple Laundry">
                        <div class="gallery-item-name">Couple Laundry</div>
                    </div>
                    <div class="gallery-item">
                        <img src="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/Logo%201200PX%20-%20White.png" alt="Logo">
                        <div class="gallery-item-name">Logo</div>
                    </div>
                    <div class="gallery-item">
                        <img src="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/20250928_134414.jpg" alt="Photo 1">
                        <div class="gallery-item-name">Photo 1</div>
                    </div>
                    <div class="gallery-item">
                        <img src="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/20250928_141101.jpg" alt="Photo 2">
                        <div class="gallery-item-name">Photo 2</div>
                    </div>
                    <div class="gallery-item">
                        <img src="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/IG%20Post%20Gratis%20Cuci.png" alt="IG Post">
                        <div class="gallery-item-name">IG Post</div>
                    </div>
                    <div class="gallery-item">
                        <img src="https://raw.githubusercontent.com/innsidelaundry-boop/innside-assets/main/Join%20Member%20Now.png" alt="Member Post">
                        <div class="gallery-item-name">Member Post</div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="footer">
            <p>© 2026 InnSide Laundry. All assets reserved.</p>
        </footer>
    </div>
</body>
</html>
